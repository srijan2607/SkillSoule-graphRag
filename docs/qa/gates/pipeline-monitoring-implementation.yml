    - id: "PERF-002"
      severity: "MEDIUM"
      category: "PERFORMANCE"
      priority: "P2"
      title: "Sequential WebSocket broadcast will not scale beyond 20 clients"
      location: "technical-implementation-details.md:881-906"
      line_reference: "PipelineMonitoringService._broadcast_event()"
      description: |
        Current implementation broadcasts events sequentially (for-loop).

        Performance impact:
        - 10 clients: ~50ms
        - 100 clients: ~500ms
        - 1000 clients: ~5000ms

        Will cause pipeline delays as client count grows.
      impact: |
        System will not scale to large number of monitoring clients.
        Pipeline execution slows down due to broadcast overhead.
      evidence:
        - "technical-implementation-details.md:881-906 shows sequential implementation"
        - "Optimization to parallel broadcast documented but not implemented"
      recommendation: |
        Implement parallel broadcast as documented:

        ```python
        async def _broadcast_event(self, event: Dict[str, Any]) -> None:
            """Broadcast event to all clients in parallel."""
            # Serialize once
            event_json = json.dumps(event)

            # Broadcast in parallel
            tasks = [
                websocket.send_text(event_json)
                for websocket in self._websocket_connections
            ]
            results = await asyncio.gather(*tasks, return_exceptions=True)

            # Handle failures
            dead_connections = []
            for i, result in enumerate(results):
                if isinstance(result, Exception):
                    dead_connections.append(self._websocket_connections[i])

            # Cleanup
            for dead_ws in dead_connections:
                self._websocket_connections.remove(dead_ws)
        ```

        Expected improvement: 90-99% latency reduction
      status: "OPTIMIZATION_NEEDED"
      owner: "dev"
      estimated_effort: "2-3 hours"

    - id: "RELIABLE-001"
      severity: "MEDIUM"
      category: "RELIABILITY"
      priority: "P2"
      title: "WebSocket has no automatic reconnection - events lost during network interruptions"
      location: "Frontend WebSocket client implementation"
      line_reference: "pipeline-monitoring-qa-guide.md:1007-1024"
      description: |
        WebSocket clients do not automatically reconnect after network interruptions.
        Users lose monitoring events during temporary disconnections.
      impact: |
        Poor user experience during network instability.
        Lost visibility into pipeline execution during disconnection.
      evidence:
        - "pipeline-monitoring-qa-guide.md:1007-1024 acknowledges issue as 'acceptable'"
        - "No reconnection logic in frontend examples"
      recommendation: |
        Implement automatic reconnection with exponential backoff:

        ```javascript
        class ResilientWebSocket {
          constructor(url) {
            this.url = url;
            this.reconnectDelay = 1000;
            this.maxReconnectDelay = 30000;
            this.connect();
          }

          connect() {
            this.ws = new WebSocket(this.url);

            this.ws.onopen = () => {
              console.log('Connected');
              this.reconnectDelay = 1000; // Reset delay
            };

            this.ws.onclose = () => {
              console.log(`Disconnected. Reconnecting in ${this.reconnectDelay}ms`);
              setTimeout(() => this.connect(), this.reconnectDelay);

              // Exponential backoff
              this.reconnectDelay = Math.min(
                this.reconnectDelay * 2,
                this.maxReconnectDelay
              );
            };

            this.ws.onmessage = (event) => {
              const message = JSON.parse(event.data);
              this.handleMessage(message);
            };
          }
        }
        ```
      status: "RECOMMENDED"
      owner: "dev"
      estimated_effort: "3-4 hours"

    - id: "VALIDATION-002"
      severity: "MEDIUM"
      category: "VALIDATION"
      priority: "P2"
      title: "No validation that WebSocket events match expected schema"
      location: "Frontend event handling"
      line_reference: "api-changes-reference.md:120-148"
      description: |
        Frontend clients receive WebSocket events but don't validate schema.
        Malformed events or schema changes could cause runtime errors.
      impact: |
        Poor error handling if backend sends unexpected event format.
        Difficult debugging when schema violations occur.
      evidence:
        - "Frontend examples show no schema validation"
        - "TypeScript interfaces defined but not enforced at runtime"
      recommendation: |
        Add runtime schema validation:

        ```javascript
        import { z } from 'zod';

        const PipelineStageEventSchema = z.object({
          event_type: z.literal('pipeline_stage'),
          stage: z.enum([
            'query_understanding',
            'vector_search',
            'graph_traversal',
            'context_construction',
            'response_generation'
          ]),
          status: z.enum(['started', 'in_progress', 'completed', 'failed', 'skipped']),
          session_id: z.string(),
          user_id: z.string(),
          query: z.string(),
          timestamp: z.string(),
          duration_ms: z.number().optional(),
          data: z.record(z.any()).optional()
        });

        ws.onmessage = (event) => {
          try {
            const message = JSON.parse(event.data);
            const validated = PipelineStageEventSchema.parse(message);
            handlePipelineEvent(validated);
          } catch (error) {
            console.error('Invalid event schema:', error);
            // Report to error tracking service
          }
        };
        ```
      status: "RECOMMENDED"
      owner: "dev"
      estimated_effort: "2-3 hours"


    # HIGH SEVERITY
    - id: "RATE-001"
      severity: "HIGH"
      category: "RELIABILITY"
      priority: "P1"
      title: "No circuit breaker for OpenRouter LLM API - cascade failure risk"
      location: "backend/app/agents/nodes/response_generation.py"
      line_reference: "pipeline-monitoring-qa-guide.md:972-987"
      description: |
        LLM rate limiting handled only with simple retry logic (3 attempts with backoff).
        No circuit breaker pattern to prevent cascade failures when OpenRouter is unavailable
        or rate-limited.
      impact: |
        HIGH RELIABILITY RISK:
        - Service degradation when rate limits hit
        - Wasted retries during prolonged outages
        - Poor user experience (long timeouts)
        - Resource exhaustion (threads blocked on retries)
        - No graceful degradation strategy

        Scenario:
        1. OpenRouter hits rate limit
        2. All incoming queries retry 3 times each
        3. Each retry waits with exponential backoff
        4. Users wait 15+ seconds for failure
        5. System resources consumed by blocked retries
      evidence:
        - "pipeline-monitoring-qa-guide.md:972-987 shows retry-only strategy"
        - "TC-010 documents rate limit handling but no circuit breaker"
      recommendation: |
        Implement circuit breaker pattern with fallback:

        ```python
        from circuitbreaker import circuit

        @circuit(failure_threshold=5, recovery_timeout=60)
        async def call_llm_with_circuit_breaker(prompt: str):
            """Call LLM with circuit breaker protection."""
            try:
                return await openrouter_client.generate(prompt)
            except RateLimitError:
                # Circuit opens after 5 consecutive rate limit errors
                # Stays open for 60 seconds before half-open retry
                raise

        async def generate_response_with_fallback(context: str, query: str):
            """Generate response with fallback strategy."""
            try:
                return await call_llm_with_circuit_breaker(
                    build_prompt(context, query)
                )
            except CircuitBreakerError:
                # Circuit is open - return fallback response
                logger.warning("LLM circuit breaker open - using fallback")
                return generate_fallback_response(context, query)

        def generate_fallback_response(context: str, query: str) -> str:
            """Generate simple response from graph context when LLM unavailable."""
            # Extract key information from context
            # Return structured response without LLM
            return f"Based on our knowledge graph, here are relevant findings:\\n{context}"
        ```

        Benefits:
        - Fast fail when LLM unavailable (no wasted retries)
        - Graceful degradation with fallback responses
        - Automatic recovery when service restored
        - Better resource utilization
      status: "REQUIRED_FOR_PRODUCTION"
      owner: "dev"
      estimated_effort: "4-6 hours"
      verification: |
        - Unit test: Circuit breaker opens after threshold failures
        - Unit test: Fallback response generated when circuit open
        - Integration test: System handles prolonged LLM outage
        - Manual test: Verify user sees fallback response during outage

    # MEDIUM SEVERITY
    - id: "PERF-001"
      severity: "MEDIUM"

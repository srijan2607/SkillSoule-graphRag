  items:
    # CRITICAL SEVERITY
    - id: "SEC-001"
      severity: "CRITICAL"
      category: "SECURITY"
      priority: "P0"
      title: "WebSocket endpoint has NO authentication or authorization"
      location: "backend/app/api/monitor.py:/monitor/live endpoint"
      line_reference: "Documented in api-changes-reference.md:24-54"
      description: |
        The /monitor/live WebSocket endpoint is completely open with no authentication.
        Any client can connect and receive real-time pipeline events containing:
        - User queries (potentially sensitive information)
        - Session IDs for all users
        - User IDs (PII)
        - Pipeline execution metrics
      impact: |
        CRITICAL SECURITY VULNERABILITY:
        - Privacy violation: User queries are exposed
        - Session hijacking risk: Session IDs visible to attackers
        - Competitive intelligence: Query patterns reveal business insights
        - Infrastructure mapping: Performance metrics expose system architecture

        CVSS Score: 9.1 (Critical)
        Attack Vector: Network
        Attack Complexity: Low
        Privileges Required: None
        User Interaction: None
        Confidentiality Impact: High
        Integrity Impact: None
        Availability Impact: Low
      evidence:
        - "api-changes-reference.md:46-53 shows connection example with no auth"
        - "No mention of authentication in any documentation"
        - "WebSocket endpoint accepts any connection"
      recommendation: |
        IMMEDIATE ACTION REQUIRED BEFORE PRODUCTION:
        1. Implement JWT token authentication
           - Require token in WebSocket connection header or query param
           - Validate token on connection establishment
           - Reject unauthorized connections with 401

        2. Implement role-based authorization
           - Restrict monitoring to admin/developer roles
           - Add user role check after authentication
           - Implement different visibility levels (admin sees all, user sees own)

        3. Add rate limiting
           - Limit connections per user (e.g., 3 concurrent)
           - Implement IP-based rate limiting for abuse prevention

        4. Add security headers
           - Implement CSP for WebSocket origin validation
           - Add X-Frame-Options to prevent clickjacking

        Example implementation:
        ```python
        @router.websocket("/live")
        async def websocket_live_queries(
            websocket: WebSocket,
            token: str = Query(..., description="JWT token")
        ):
            # Validate token
            try:
                payload = verify_jwt_token(token)
                user_id = payload.get("user_id")
                role = payload.get("role")

                # Check authorization
                if role not in ["admin", "developer"]:
                    await websocket.close(code=1008, reason="Unauthorized")
                    return

                await websocket.accept()
                # ... rest of implementation
            except JWTError:
                await websocket.close(code=1008, reason="Invalid token")
        ```
      status: "BLOCKING"
      must_fix_before: "PRODUCTION"
      owner: "dev"
      estimated_effort: "4-8 hours"
      verification: |
        - Unit test: Token validation logic
        - Integration test: Unauthorized connection rejected
        - Integration test: Authorized connection accepted
        - Manual test: Verify 401 response for missing/invalid token

    - id: "INFRA-001"
      severity: "CRITICAL"
      category: "INFRASTRUCTURE"
      priority: "P0"
      title: "No automated verification of Neo4j vector indexes"
      location: "backend/app/main.py:startup_event (missing)"
      line_reference: "Manual verification shown in pipeline-monitoring-qa-guide.md:455-466"
      description: |
        Application does not verify that required Neo4j vector indexes exist on startup.
        Vector search will fail at runtime if indexes are missing, breaking core RAG functionality.

        Required indexes:
        - skill_embedding_idx (Skill.embedding)
        - job_embedding_idx (Job.embedding)
        - company_embedding_idx (Company.embedding)
      impact: |
        CRITICAL PRODUCTION RISK:
        - Application starts successfully even if indexes missing
        - First query attempt fails with "index not found" error
        - Poor user experience: System appears healthy but fails on use
        - Difficult debugging: Error happens deep in query execution
        - Manual verification required after every deployment

        Scenario:
        1. Deploy to new environment
        2. Forget to run initial_setup.py
        3. Application starts normally (no errors)
        4. User attempts query
        5. Vector search fails: "Neo.ClientError.Procedure.ProcedureCallFailed"
        6. Cascade failure: Pipeline cannot complete
      evidence:
        - "pipeline-monitoring-qa-guide.md:455-466 shows MANUAL verification only"
        - "No startup health check mentioned in any documentation"
        - "No automated validation in backend/scripts/initial_setup.py"
      recommendation: |
        IMMEDIATE ACTION REQUIRED:
        1. Add startup health check in backend/app/main.py

        ```python
        @app.on_event("startup")
        async def verify_infrastructure():
            """Verify all required infrastructure is available."""
            logger.info("Starting infrastructure validation...")

            # Verify Neo4j vector indexes
            required_indexes = [
                "skill_embedding_idx",
                "job_embedding_idx",
                "company_embedding_idx"
            ]

            neo4j_repo = Neo4jRepository(...)
            await neo4j_repo.connect()

            try:
                result = await neo4j_repo.execute_query("SHOW INDEXES")
                existing_indexes = [record["name"] for record in result]

                missing_indexes = [
                    idx for idx in required_indexes
                    if idx not in existing_indexes
                ]

                if missing_indexes:
                    logger.error(
                        f"CRITICAL: Missing Neo4j vector indexes: {missing_indexes}. "
                        f"Run backend/scripts/initial_setup.py before starting."
                    )
                    raise RuntimeError(f"Missing vector indexes: {missing_indexes}")

                # Verify indexes are ONLINE
                for idx in required_indexes:
                    index_info = next((r for r in result if r["name"] == idx), None)
                    if index_info["state"] != "ONLINE":
                        raise RuntimeError(
                            f"Index {idx} is not ONLINE (state: {index_info['state']})"
                        )

                logger.info(f"✅ All {len(required_indexes)} vector indexes validated")
            finally:
                await neo4j_repo.close()
        ```

        2. Add health check endpoint: GET /health
           - Returns 200 if all infrastructure healthy
           - Returns 503 if indexes missing
           - Include in deployment readiness checks

        3. Update deployment documentation
           - Add infrastructure prerequisites
           - Document initial_setup.py requirement
           - Add validation steps to deployment checklist
      status: "BLOCKING"
      must_fix_before: "PRODUCTION"
      owner: "dev"
      estimated_effort: "2-4 hours"
      verification: |
        - Unit test: Health check detects missing indexes
        - Integration test: App fails to start without indexes
        - Integration test: App starts successfully with indexes
        - Manual test: Delete index, verify startup failure


    - "Job node creation: 2 tests (all fields + NULL handling)"
    - "Company node creation: 2 tests (with/without embedding)"
    - "Location node creation: 2 tests (with/without district)"
    - "Relationship creation: 4 tests (all combinations)"
    - "Graph creation: 2 tests (single batch + error handling)"
  integration_tests:

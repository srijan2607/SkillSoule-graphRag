# Technical Details
implementation_highlights:
  - "All 30 CSV job fields properly mapped to Job node properties"
  - "Intelligent embedding selection: Job Description (primary) → Description (fallback) → empty"
  - "Company embedding deduplication per batch minimizes API calls"
  - "MERGE upsert pattern prevents duplicates on re-ingestion"
  - "ON CREATE/ON MATCH strategy updates embeddings on re-ingestion"
  - "Transaction safety with explicit commit/rollback"
  - "Unique company/location tracking across batches for accurate statistics"
  - "Boolean field conversion for Work From Home and Exact Matched Company"
  - "ISO datetime parsing with error handling for Posted At field"


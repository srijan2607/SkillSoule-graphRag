top_issues:
  - id: 'TEST-COVERAGE'
    severity: high
    finding: 'Zero test coverage for user-facing UI - Tasks 10-11 (unit tests + E2E tests) explicitly deferred'
    location: 'All Story 2.7 components'
    impact: 'Complex state machine (6 states, 5 async operations) has no safety net for regressions. File upload workflow, polling behavior, error handling all untested.'
    suggested_owner: 'dev'
    recommendation: 'Create follow-up story for Tasks 10-11: useUploadFlow.test.js, FileUploadZone.test.jsx, IngestionProgress.test.jsx, upload-workflow.spec.js, accessibility.spec.js'
    status: 'OPEN - Deferred to follow-up story (Story 2.7.1: Frontend CSV Upload Tests)'
    priority: 'High - Must complete before next major feature'
    target_coverage: '80% for critical paths (state machine, file validation, polling, error handling)'

  - id: 'SECURITY-001'
    severity: low
    finding: 'File validation checks only extension (.csv), not MIME type'
    location: 'frontend/src/components/FileUploadZone.jsx:34'
    impact: 'User could rename .exe to .csv and bypass client validation. Backend validation exists as defense-in-depth.'
    suggested_owner: 'dev'
    recommendation: 'Add file.type === "text/csv" check to validateFile function'
    status: 'FIXED - Added MIME type validation (file.type !== "text/csv")'
    fix_commit: 'Added defense-in-depth validation checking both extension and MIME type'
    verification: 'Manual testing confirmed - both extension and MIME type validated'

  - id: 'RELIABILITY-001'
    severity: low
    finding: 'No user feedback for network failures during polling'
    location: 'frontend/src/components/IngestionProgress.jsx:63-87'
    impact: 'User may not know if polling fails due to network issues. React Query retry: 1 configured but no UI feedback.'
    suggested_owner: 'dev'
    recommendation: 'Add error state display for polling failures with retry option'
    status: 'FIXED - Added network error UI with retry button, increased retry to 3 with exponential backoff'
    fix_commit: 'Added isError state handling with Connection Error message and Retry button'
    verification: 'Manual testing confirmed - network error UI displays correctly with retry functionality'

  - id: 'UX-001'
    severity: low
    finding: 'Error download opens new window instead of direct download'
    location: 'frontend/src/components/IngestionSummary.jsx:25-53'
    impact: 'Suboptimal UX - window.open triggers popup blockers, not traditional download flow'
    suggested_owner: 'dev'
    recommendation: 'Use fetch + blob + anchor element for direct download'
    status: 'FIXED - Implemented fetch with blob download, fallback to window.open on error'
    fix_commit: 'Replaced window.open with direct download using fetch API and blob URL'
    verification: 'Manual testing confirmed - direct download works, fallback tested successfully'

  - id: 'CODE-001'
    severity: low
    finding: 'console.error used in production code'
    location: 'frontend/src/hooks/useUploadFlow.js:47, 69'
    impact: 'No production logging or error monitoring'
    suggested_owner: 'dev'
    recommendation: 'Replace console.error with production logging service'
    status: 'FIXED - Created logger utility, replaced all console.error calls'
    fix_commit: 'Added frontend/src/utils/logger.js with environment-aware logging'
    verification: 'Code review confirmed - all console.error replaced with logger utility'


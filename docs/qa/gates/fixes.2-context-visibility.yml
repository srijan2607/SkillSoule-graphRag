# Performance Monitoring SQL
performance_monitoring:
  database_growth_query: |
    -- Weekly monitoring query for context storage growth
    SELECT 
      COUNT(*) as total_queries,
      AVG(LENGTH(metadata::text)) as avg_metadata_size_bytes,
      SUM(LENGTH(metadata::text))/(1024*1024) as total_metadata_mb,
      MAX(LENGTH(metadata::text)) as max_metadata_size_bytes
    FROM query_history
    WHERE created_at > NOW() - INTERVAL '7 days';
  
  token_counting_monitoring: |
    -- Check context construction timing from logs
    grep "ContextConstruction" logs/app.log | grep "Completed in" | awk '{print $NF}' | sort -n


# Top issues - RESOLUTION STATUS UPDATED
top_issues:
  - id: "STATS-001"
    severity: medium
    status: RESOLVED
    finding: "Statistics overcounting - categories/subcategories counter increments for EVERY skill instead of unique entities"
    location: "backend/app/services/skill_graph_service.py:161, 170"
    impact: "Misleading metrics make monitoring/debugging difficult. Example: 1000 skills sharing 'CAT001' reports 1000 categories instead of 1"
    resolution: "Implemented set-based tracking for unique categories/subcategories. Added unique_categories and unique_subcategories sets (lines 77-79). Modified batch processing to track unique IDs before incrementing (lines 170-186). Statistics now count unique entities correctly."
    resolution_date: "2025-10-24"
    files_modified:
      - "backend/app/services/skill_graph_service.py (lines 77-79, 92-103, 127-135, 170-186)"
    suggested_owner: dev

  - id: "PROGRESS-001"
    severity: medium
    status: RESOLVED
    finding: "Progress tracking calculation bug - uses batch size instead of total skills count"
    location: "backend/app/services/skill_graph_service.py:194"
    impact: "Incorrect progress percentages in monitoring. Batch 3 of 2500 skills would report 3000/batch_size instead of 3000/2500"
    resolution: "Updated _process_skills_batch() method signature to accept total_skills parameter (line 132). Fixed calculation to use total_skills instead of batch size (line 210): processed_count = min(batch_number * BATCH_SIZE, total_skills)"
    resolution_date: "2025-10-24"
    files_modified:
      - "backend/app/services/skill_graph_service.py (lines 127-135, 210)"
    suggested_owner: dev

  - id: "PROGRESS-002"
    severity: medium
    status: RESOLVED
    finding: "Progress update passes wrong total_records parameter - batch size instead of total skills"
    location: "backend/app/services/skill_graph_service.py:195-199"
    impact: "Progress percentage calculation will be incorrect"
    resolution: "Fixed update_progress() call to pass total_skills as total_records parameter instead of batch size (lines 210-215). Progress tracking now calculates percentages correctly against total skills count."
    resolution_date: "2025-10-24"
    files_modified:
      - "backend/app/services/skill_graph_service.py (lines 210-215)"
    suggested_owner: dev

  - id: "VALIDATION-001"
    severity: medium
    status: RESOLVED
    finding: "Missing input validation for required CSV fields - direct dictionary access without checks"
    location: "backend/app/services/skill_graph_service.py:295 (and other dict accesses)"
    impact: "Runtime KeyError with malformed CSV data (missing ID or NAME fields)"
    resolution: "Added _validate_required_fields() method (lines 35-61) to validate required fields ['ID', 'NAME'] exist and are non-empty. Called at entry point in create_skill_graph() (line 64). Provides clear error messages with row numbers for missing or empty fields."
    resolution_date: "2025-10-24"
    files_modified:
      - "backend/app/services/skill_graph_service.py (lines 35-64)"
    suggested_owner: dev

  - id: "TEST-001"
    severity: low
    status: RESOLVED
    finding: "Integration tests may not clean up test data between runs"
    location: "backend/tests/integration/test_skill_graph_construction.py:279"
    impact: "Test isolation concern - line 279 uses '>= 1000' suggesting cumulative data"
    resolution: "Added proper fixtures with cleanup in conftest.py (lines 91-115). neo4j_test_db fixture now runs 'MATCH (n) DETACH DELETE n' before and after each test. prisma_test_db creates test user with cleanup. Fixed assertion to expect exact count (line 279): assert record['count'] == 1000"
    resolution_date: "2025-10-24"
    files_modified:
      - "backend/tests/conftest.py (lines 65-115)"
      - "backend/tests/integration/test_skill_graph_construction.py (line 279, all job creation calls)"
    suggested_owner: dev

  - id: "RETRY-001"
    severity: low
    status: DEFERRED
    finding: "No retry logic for transient database failures"
    location: "backend/app/services/skill_graph_service.py:147-191"
    impact: "Transient Neo4j connection failures abort batch permanently (acceptable for MVP)"
    deferral_reason: "MVP acceptable - MERGE idempotency ensures safe manual re-runs. Planned for production deployment with exponential backoff retry using tenacity library."
    planned_for: "Production Release"
    suggested_owner: dev

